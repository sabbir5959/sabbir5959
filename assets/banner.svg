<svg width="800" height="200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="200" fill="#0a0e27"/>
  
  <!-- Gradient Border -->
  <defs>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00ff41;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00d9ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00ff41;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00ff41;stop-opacity:1" />
      <stop offset="25%" style="stop-color:#39ff14;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00d9ff;stop-opacity:1" />
      <stop offset="75%" style="stop-color:#39ff14;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00ff41;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Border -->
  <rect x="20" y="20" width="760" height="160" fill="none" stroke="url(#borderGrad)" stroke-width="2" rx="8"/>
  
  <!-- SABBIR Name - Centered -->
  <text x="400" y="90" font-family="'Courier New', monospace" font-size="64" font-weight="bold" text-anchor="middle" fill="url(#textGrad)" letter-spacing="8">
    SABBIR
  </text>
  
  <!-- Subtitle -->
  <text x="400" y="135" font-family="'Courier New', monospace" font-size="16" text-anchor="middle">
    <tspan fill="#00ff41">◆</tspan>
    <tspan fill="#e0e0e0"> Developer </tspan>
    <tspan fill="#00ff41">●</tspan>
    <tspan fill="#e0e0e0"> CTF Player </tspan>
    <tspan fill="#00ff41">●</tspan>
    <tspan fill="#e0e0e0"> Security Enthusiast </tspan>
    <tspan fill="#00ff41">◆</tspan>
  </text>
</svg>
