<svg width="800" height="200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="200" fill="#0a0e27"/>
  
  <!-- Gradients -->
  <defs>
    <!-- Animated Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00ff41;stop-opacity:1">
        <animate attributeName="stop-color" values="#00ff41;#00d9ff;#ff0080;#39ff14;#00ff41" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" style="stop-color:#00d9ff;stop-opacity:1">
        <animate attributeName="stop-color" values="#00d9ff;#ff0080;#39ff14;#00ff41;#00d9ff" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#00ff41;stop-opacity:1">
        <animate attributeName="stop-color" values="#00ff41;#39ff14;#00d9ff;#ff0080;#00ff41" dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    
    <!-- Animated Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00ff41">
        <animate attributeName="stop-color" values="#00ff41;#39ff14;#00d9ff;#00ff41" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="25%" style="stop-color:#39ff14">
        <animate attributeName="stop-color" values="#39ff14;#00d9ff;#00ff41;#39ff14" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" style="stop-color:#00d9ff">
        <animate attributeName="stop-color" values="#00d9ff;#00ff41;#39ff14;#00d9ff" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="75%" style="stop-color:#39ff14">
        <animate attributeName="stop-color" values="#39ff14;#00ff41;#00d9ff;#39ff14" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#00ff41">
        <animate attributeName="stop-color" values="#00ff41;#00d9ff;#39ff14;#00ff41" dur="3s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    
    <!-- Glow Filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Animated Border -->
  <rect x="20" y="20" width="760" height="160" fill="none" stroke="url(#borderGrad)" stroke-width="3" rx="8" filter="url(#glow)">
    <animate attributeName="stroke-width" values="2;4;2" dur="2s" repeatCount="indefinite"/>
  </rect>
  
  <!-- SABBIR Name - Centered with Animation -->
  <text x="400" y="90" font-family="'Courier New', monospace" font-size="64" font-weight="bold" text-anchor="middle" fill="url(#textGrad)" letter-spacing="8" filter="url(#glow)">
    SABBIR
    <animate attributeName="opacity" values="1;0.8;1" dur="2s" repeatCount="indefinite"/>
  </text>
  
  <!-- Subtitle with Color Animation -->
  <text x="400" y="135" font-family="'Courier New', monospace" font-size="16" text-anchor="middle">
    <tspan fill="#00ff41">
      ◆
      <animate attributeName="fill" values="#00ff41;#ff0080;#00d9ff;#00ff41" dur="3s" repeatCount="indefinite"/>
    </tspan>
    <tspan fill="#e0e0e0"> Developer </tspan>
    <tspan fill="#00d9ff">
      ●
      <animate attributeName="fill" values="#00d9ff;#39ff14;#ff0080;#00d9ff" dur="3s" repeatCount="indefinite"/>
    </tspan>
    <tspan fill="#e0e0e0"> CTF Player </tspan>
    <tspan fill="#39ff14">
      ●
      <animate attributeName="fill" values="#39ff14;#00ff41;#00d9ff;#39ff14" dur="3s" repeatCount="indefinite"/>
    </tspan>
    <tspan fill="#e0e0e0"> Security Enthusiast </tspan>
    <tspan fill="#ff0080">
      ◆
      <animate attributeName="fill" values="#ff0080;#00d9ff;#39ff14;#ff0080" dur="3s" repeatCount="indefinite"/>
    </tspan>
  </text>
</svg>
